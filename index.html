<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dn Phuc Store - Shop Key</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e1e1e; border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .tab-link { background: none; border: none; color: #aaa; cursor: pointer; font-weight: bold; padding: 10px; }
        .tab-link.active { color: #fff; border-bottom: 2px solid #fff; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .btn-main { background: #ff4757; color: #fff; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-main:hover { background: #ff6b81; }
        h2 { margin-bottom: 15px; }
        p { color: #ccc; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-tabs">
            <button class="tab-link active" onclick="show(event, 'home')">Cổng Vào</button>
            <button class="tab-link" onclick="show(event, 'free')">Free Key</button>
            <button class="tab-link" onclick="show(event, 'premium')">Mua Premium</button>
        </div>

        <div id="home" class="form-section active">
            <h2>Dn Phuc Store</h2>
            <p>Uy tín tạo nên thương hiệu. Chọn tính năng ở trên để bắt đầu!</p>
        </div>

        <div id="free" class="form-section">
            <h2>Get Key Free</h2>
            <p>Vượt link nhận key miễn phí ngay.</p>
            <button class="btn-main" onclick="alert('Đang chuyển hướng lấy key...')">LẤY KEY NGAY</button>
        </div>

        <div id="premium" class="form-section">
            <h2>Mua Premium</h2>
            <p>Key VIP - Không quảng cáo - Hỗ trợ 24/7.</p>
            <input type="text" style="width: 100%; padding: 10px; border-radius: 5px; border: none;" placeholder="Nhập tên Roblox của bạn">
            <button class="btn-main" onclick="alert('Liên hệ Admin qua Discord để thanh toán!')">THANH TOÁN</button>
        </div>
    </div>

    <script>
        function show(evt, id) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
